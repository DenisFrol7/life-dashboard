spring:
  application:
    name: life-dashboard-backend
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/life_dashboard}
    username: ${DB_USERNAME:${POSTGRES_USER:life_dashboard}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}

app:
  default-user-id: ${DEFAULT_USER_ID:1}
  backup-directory: ${BACKUP_DIRECTORY:../backups}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
