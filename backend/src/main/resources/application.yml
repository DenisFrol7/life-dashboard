spring:
  application:
    name: life-dashboard-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/life_dashboard}
    username: ${DB_USERNAME:${POSTGRES_USER:life_dashboard}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
